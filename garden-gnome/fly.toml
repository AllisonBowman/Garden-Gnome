# fly.toml app configuration file generated for garden-gnome-api on 2026-07-07T00:01:05-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'garden-gnome-api'
primary_region = 'iad'

[build]
[env]
  DATABASE_URL = 'sqlite:////data/garden_gnome.db'

[[mounts]]
  source = 'gnome_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  # 512, not 256. uvicorn idles near 116 MB and the first GET /species/ (the
  # whole catalog, built once and then cached) takes it to about 153 MB.
  # Before that cache, ten phones at once took it past 240 MB, which a 256 MB
  # guest cannot give a process; the headroom is for the next thing like it.
  memory = '512mb'
